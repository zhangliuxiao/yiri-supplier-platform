<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亿日供方开发管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a1a2e; color: white; padding: 20px 0; overflow-y: auto; }
        .sidebar h2 { text-align: center; padding: 0 20px 20px; border-bottom: 1px solid #333; font-size: 16px; }
        .nav-item { padding: 15px 25px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: #16213e; }
        .nav-item.active { background: #0f3460; border-left: 3px solid #e94560; }
        .nav-icon { font-size: 18px; }
        .main { margin-left: 220px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #1a1a2e; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c73e54; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #1a1a2e; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; border-radius: 12px; text-align: center; }
        .stat-card.green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .stat-card.orange { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .stat-card.blue { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .stat-card.pink { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); }
        .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #6b7280; font-size: 13px; text-transform: uppercase; }
        tr:hover { background: #f9fafb; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-potential { background: #dbeafe; color: #1d4ed8; }
        .badge-review { background: #fef3c7; color: #92400e; }
        .badge-qualified { background: #d1fae5; color: #065f46; }
        .badge-disqualified { background: #fee2e2; color: #991b1b; }
        .badge-blacklisted { background: #fce7f3; color: #9d174d; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { font-size: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; }
        .progress-bar { background: #e5e7eb; border-radius: 8px; height: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; border-radius: 8px; transition: width 0.3s; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .page { display: none; }
        .page.active { display: block; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 2000; animation: slideIn 0.3s ease; }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2> 亿日供方管理平台</h2>
        <div class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">📊</span> 仪表盘</div>
        <div class="nav-item" onclick="showPage('suppliers')"><span class="nav-icon">📋</span> 供应商列表</div>
        <div class="nav-item" onclick="showPage('add-supplier')"><span class="nav-icon">➕</span> 新增供应商</div>
        <div class="nav-item" onclick="showPage('evaluations')"><span class="nav-icon">📝</span> 评估管理</div>
        <div class="nav-item" onclick="showPage('development')"><span class="nav-icon">🚀</span> 开发项目</div>
        <div class="nav-item" onclick="showPage('categories')"><span class="nav-icon">📁</span> 分类管理</div>
    </div>
    <div class="main">
        <div id="dashboard" class="page active">
            <div class="header"><h1>📊 数据仪表盘</h1></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">供应商总数</div></div>
                <div class="stat-card green"><div class="stat-value" id="stat-qualified">0</div><div class="stat-label">合格供应商</div></div>
                <div class="stat-card orange"><div class="stat-value" id="stat-review">0</div><div class="stat-label">评审中</div></div>
                <div class="stat-card blue"><div class="stat-value" id="stat-dev">0</div><div class="stat-label">进行中项目</div></div>
                <div class="stat-card pink"><div class="stat-value" id="stat-eval">0</div><div class="stat-label">评估记录</div></div>
            </div>
            <div class="card"><div class="card-title">📈 供应商状态分布</div><div id="status-chart"></div></div>
        </div>
        <div id="suppliers" class="page">
            <div class="header"><h1>📋 供应商列表</h1><button class="btn btn-primary" onclick="showPage('add-supplier')">➕ 新增供应商</button></div>
            <div class="card">
                <div class="filter-bar">
                    <input type="text" id="search-input" placeholder="搜索供应商名称/编码..." oninput="loadSuppliers()">
                    <select id="filter-status" onchange="loadSuppliers()"><option value="">全部状态</option><option value="potential">潜在</option><option value="under_review">评审中</option><option value="qualified">合格</option><option value="disqualified">不合格</option><option value="blacklisted">黑名单</option></select>
                    <select id="filter-type" onchange="loadSuppliers()"><option value="">全部类型</option><option value="raw_material">原材料</option><option value="component">零部件</option><option value="equipment">设备</option><option value="service">服务</option><option value="packaging">包装</option></select>
                </div>
                <table><thead><tr><th>ID</th><th>编码</th><th>供应商名称</th><th>类型</th><th>状态</th><th>主营产品</th><th>操作</th></tr></thead><tbody id="suppliers-table"></tbody></table>
            </div>
        </div>
        <div id="add-supplier" class="page">
            <div class="header"><h1>➕ 新增供应商</h1></div>
            <div class="card">
                <form id="add-supplier-form" onsubmit="addSupplier(event)">
                    <div class="form-grid">
                        <div class="form-group"><label>供应商编码 *</label><input type="text" name="supplier_code" required placeholder="如：SUP-2024-001"></div>
                        <div class="form-group"><label>供应商名称 *</label><input type="text" name="supplier_name" required placeholder="公司全称"></div>
                        <div class="form-group"><label>简称</label><input type="text" name="short_name" placeholder="公司简称"></div>
                        <div class="form-group"><label>供应商类型 *</label><select name="supplier_type" required><option value="raw_material">原材料</option><option value="component">零部件</option><option value="equipment">设备</option><option value="service">服务</option><option value="packaging">包装</option></select></div>
                        <div class="form-group"><label>统一社会信用代码</label><input type="text" name="unified_credit_code" placeholder="18位信用代码"></div>
                        <div class="form-group"><label>注册资本</label><input type="text" name="registered_capital" placeholder="如：500万元"></div>
                        <div class="form-group"><label>法定代表人</label><input type="text" name="legal_representative"></div>
                        <div class="form-group"><label>员工人数</label><input type="number" name="employee_count" min="0"></div>
                    </div>
                    <div class="form-group"><label>注册地址</label><input type="text" name="registered_address"></div>
                    <div class="form-group"><label>主营产品/服务</label><textarea name="main_products" placeholder="描述主要提供的产品或服务"></textarea></div>
                    <div class="form-group"><label>经营范围</label><textarea name="business_scope"></textarea></div>
                    <div class="form-grid">
                        <div class="form-group"><label>公司网站</label><input type="text" name="website" placeholder="https://"></div>
                        <div class="form-group"><label>资质认证</label><input type="text" name="certification" placeholder="如：ISO9001, ISO14001"></div>
                    </div>
                    <div class="form-group"><label>备注</label><textarea name="remarks"></textarea></div>
                    <button type="submit" class="btn btn-primary">✅ 提交添加</button>
                </form>
            </div>
        </div>
        <div id="evaluations" class="page">
            <div class="header"><h1>📝 评估管理</h1></div>
            <div class="card">
                <div class="card-title">选择供应商进行评估</div>
                <div class="form-group"><select id="eval-supplier-select" onchange="loadSupplierEvaluations()"><option value="">请选择供应商</option></select></div>
                <div id="evaluations-list"></div>
                <div id="add-evaluation-form" style="display:none; margin-top: 30px; padding-top: 30px; border-top: 1px solid #e5e7eb;">
                    <h3 style="margin-bottom: 20px;">新增评估</h3>
                    <form onsubmit="addEvaluation(event)">
                        <div class="form-grid">
                            <div class="form-group"><label>评估人 *</label><input type="text" name="evaluator" required></div>
                            <div class="form-group"><label>评估类型</label><select name="evaluation_type"><option value="initial">准入评估</option><option value="periodic">定期评估</option><option value="annual">年度评估</option><option value="special">专项评估</option></select></div>
                        </div>
                        <div class="form-grid">
                            <div class="form-group"><label>质量评分 (0-100)</label><input type="number" name="quality_score" min="0" max="100" value="75"></div>
                            <div class="form-group"><label>交期评分 (0-100)</label><input type="number" name="delivery_score" min="0" max="100" value="75"></div>
                            <div class="form-group"><label>服务评分 (0-100)</label><input type="number" name="service_score" min="0" max="100" value="75"></div>
                            <div class="form-group"><label>价格评分 (0-100)</label><input type="number" name="price_score" min="0" max="100" value="75"></div>
                            <div class="form-group"><label>技术评分 (0-100)</label><input type="number" name="technology_score" min="0" max="100" value="75"></div>
                        </div>
                        <div class="form-group"><label>优势</label><textarea name="strengths"></textarea></div>
                        <div class="form-group"><label>不足</label><textarea name="weaknesses"></textarea></div>
                        <div class="form-group"><label>改进建议</label><textarea name="improvement_suggestions"></textarea></div>
                        <button type="submit" class="btn btn-primary">提交评估</button>
                    </form>
                </div>
            </div>
        </div>
        <div id="development" class="page">
            <div class="header"><h1>🚀 开发项目管理</h1></div>
            <div class="card"><div id="development-list"></div></div>
        </div>
        <div id="categories" class="page">
            <div class="header"><h1>📁 分类管理</h1></div>
            <div class="card">
                <div class="card-title">供应商分类</div>
                <div id="categories-list"></div>
                <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid #e5e7eb;">
                    <h3 style="margin-bottom: 20px;">添加新分类</h3>
                    <form onsubmit="addCategory(event)">
                        <div class="form-grid">
                            <div class="form-group"><label>分类名称 *</label><input type="text" name="category_name" required></div>
                            <div class="form-group"><label>描述</label><input type="text" name="description"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">添加分类</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="supplier-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>供应商详情</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <div id="supplier-detail-content"></div>
        </div>
    </div>
    <script>
        const API_BASE = '/api';
        const STATUS_MAP = {'potential': {label: '潜在', class: 'badge-potential'}, 'under_review': {label: '评审中', class: 'badge-review'}, 'qualified': {label: '合格', class: 'badge-qualified'}, 'disqualified': {label: '不合格', class: 'badge-disqualified'}, 'blacklisted': {label: '黑名单', class: 'badge-blacklisted'}};
        const TYPE_MAP = {'raw_material': '原材料', 'component': '零部件', 'equipment': '设备', 'service': '服务', 'packaging': '包装'};
        function showPage(pageId) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById(pageId).classList.add('active'); event.target.closest('.nav-item').classList.add('active'); if (pageId === 'dashboard') loadDashboard(); if (pageId === 'suppliers') loadSuppliers(); if (pageId === 'evaluations') loadEvaluationSuppliers(); if (pageId === 'development') loadDevelopment(); if (pageId === 'categories') loadCategories(); }
        function showToast(message, type = 'success') { const toast = document.createElement('div'); toast.className = 'toast toast-' + type; toast.textContent = message; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        async function loadDashboard() { try { const res = await fetch(API_BASE + '/suppliers'); const data = await res.json(); const suppliers = data.data || []; document.getElementById('stat-total').textContent = suppliers.length; document.getElementById('stat-qualified').textContent = suppliers.filter(s => s.status === 'qualified').length; document.getElementById('stat-review').textContent = suppliers.filter(s => s.status === 'under_review').length; const statusCounts = {}; suppliers.forEach(s => { statusCounts[s.status] = (statusCounts[s.status] || 0) + 1; }); let chartHtml = ''; for (const [status, count] of Object.entries(statusCounts)) { const pct = Math.round(count / suppliers.length * 100); const info = STATUS_MAP[status] || {label: status, class: ''}; chartHtml += '<div style="margin-bottom: 12px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span class="badge ' + info.class + '">' + info.label + '</span><span>' + count + '家 (' + pct + '%)</span></div><div class="progress-bar"><div class="progress-fill" style="width: ' + pct + '%"></div></div></div>'; } document.getElementById('status-chart').innerHTML = chartHtml || '<p style="color: #999;">暂无数据</p>'; } catch (e) { console.error('加载仪表盘失败:', e); } }
        async function loadSuppliers() { try { const search = document.getElementById('search-input').value; const status = document.getElementById('filter-status').value; const type = document.getElementById('filter-type').value; let url = API_BASE + '/suppliers?'; if (search) url += 'keyword=' + encodeURIComponent(search) + '&'; if (status) url += 'status=' + status + '&'; if (type) url += 'supplier_type=' + type + '&'; const res = await fetch(url); const data = await res.json(); const suppliers = data.data || []; let html = ''; suppliers.forEach(s => { const statusInfo = STATUS_MAP[s.status] || {label: s.status, class: ''}; html += '<tr><td>' + s.id + '</td><td>' + s.supplier_code + '</td><td>' + s.supplier_name + '</td><td>' + (TYPE_MAP[s.supplier_type] || s.supplier_type) + '</td><td><span class="badge ' + statusInfo.class + '">' + statusInfo.label + '</span></td><td>' + (s.main_products || '-') + '</td><td><button class="btn btn-secondary" onclick="viewSupplier(' + s.id + ')" style="padding: 6px 12px; font-size: 12px;">详情</button> <button class="btn btn-warning" onclick="changeStatus(' + s.id + ')" style="padding: 6px 12px; font-size: 12px;">变更状态</button></td></tr>'; }); document.getElementById('suppliers-table').innerHTML = html || '<tr><td colspan="7" style="text-align: center; color: #999;">暂无数据</td></tr>'; } catch (e) { console.error('加载供应商失败:', e); } }
        async function addSupplier(e) { e.preventDefault(); const form = e.target; const data = Object.fromEntries(new FormData(form)); if (data.employee_count) data.employee_count = parseInt(data.employee_count); try { const res = await fetch(API_BASE + '/suppliers', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)}); const result = await res.json(); if (result.success) { showToast('供应商添加成功！'); form.reset(); showPage('suppliers'); } else { showToast(result.message || '添加失败', 'error'); } } catch (e) { showToast('网络错误', 'error'); } }
        async function viewSupplier(id) { try { const res = await fetch(API_BASE + '/suppliers/' + id); const data = await res.json(); const s = data.data; const statusInfo = STATUS_MAP[s.status] || {label: s.status, class: ''}; let html = '<div style="margin-bottom: 20px;"><h2 style="margin-bottom: 8px;">' + s.supplier_name + '</h2><p style="color: #666;">编码: ' + s.supplier_code + ' | <span class="badge ' + statusInfo.class + '">' + statusInfo.label + '</span></p></div><div class="form-grid"><div><strong>类型:</strong> ' + (TYPE_MAP[s.supplier_type] || s.supplier_type) + '</div><div><strong>注册资本:</strong> ' + (s.registered_capital || '-') + '</div><div><strong>法定代表人:</strong> ' + (s.legal_representative || '-') + '</div><div><strong>员工人数:</strong> ' + (s.employee_count || '-') + '</div><div><strong>主营产品:</strong> ' + (s.main_products || '-') + '</div><div><strong>资质认证:</strong> ' + (s.certification || '-') + '</div></div><div style="margin-top: 20px;"><strong>注册地址:</strong> ' + (s.registered_address || '-') + '</div><div style="margin-top: 10px;"><strong>备注:</strong> ' + (s.remarks || '-') + '</div>'; document.getElementById('supplier-detail-content').innerHTML = html; document.getElementById('supplier-modal').classList.add('show'); } catch (e) { showToast('加载详情失败', 'error'); } }
        function closeModal() { document.getElementById('supplier-modal').classList.remove('show'); }
        async function changeStatus(id) { const newStatus = prompt('请输入新状态 (potential/under_review/qualified/disqualified/blacklisted):'); if (newStatus) { try { const res = await fetch(API_BASE + '/suppliers/' + id + '/status', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status: newStatus})}); const result = await res.json(); if (result.success) { showToast('状态更新成功！'); loadSuppliers(); } else { showToast(result.message || '更新失败', 'error'); } } catch (e) { showToast('网络错误', 'error'); } } }
        async function loadEvaluationSuppliers() { try { const res = await fetch(API_BASE + '/suppliers'); const data = await res.json(); const suppliers = data.data || []; let options = '<option value="">请选择供应商</option>'; suppliers.forEach(s => { options += '<option value="' + s.id + '">' + s.supplier_name + ' (' + s.supplier_code + ')</option>'; }); document.getElementById('eval-supplier-select').innerHTML = options; } catch (e) { console.error('加载供应商列表失败:', e); } }
        async function loadSupplierEvaluations() { const supplierId = document.getElementById('eval-supplier-select').value; if (!supplierId) { document.getElementById('evaluations-list').innerHTML = ''; document.getElementById('add-evaluation-form').style.display = 'none'; return; } document.getElementById('add-evaluation-form').style.display = 'block'; try { const res = await fetch(API_BASE + '/suppliers/' + supplierId + '/evaluations'); const data = await res.json(); const evals = data.data || []; let html = '<h4 style="margin: 20px 0 10px;">历史评估记录</h4>'; if (evals.length === 0) { html += '<p style="color: #999;">暂无评估记录</p>'; } else { evals.forEach(e => { html += '<div class="card" style="margin-bottom: 12px; padding: 16px;"><div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><strong>' + (e.evaluation_date ? e.evaluation_date.substring(0, 10) : '') + '</strong><span>评估人: ' + e.evaluator + '</span></div><div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; font-size: 13px;"><div>质量: ' + (e.quality_score || '-') + '</div><div>交期: ' + (e.delivery_score || '-') + '</div><div>服务: ' + (e.service_score || '-') + '</div><div>价格: ' + (e.price_score || '-') + '</div><div>技术: ' + (e.technology_score || '-') + '</div></div><div style="margin-top: 8px; font-weight: 600;">综合评分: ' + (e.total_score || '-') + ' | 结果: ' + (e.evaluation_result || '-') + '</div></div>'; }); } document.getElementById('evaluations-list').innerHTML = html; } catch (e) { console.error('加载评估记录失败:', e); } }
